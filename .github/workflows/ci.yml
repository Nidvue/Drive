name: ci

on:
  # Every push and pull request runs the full matrix. A path filter here would
  # make a required check "wait" forever on a documentation-only change.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request head, not GitHub's synthetic merge commit: the DCO
          # check and the tests must see the commits under review.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: doc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: dco
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          missing=0
          for sha in $(git rev-list --no-merges "$base"..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha is missing a Signed-off-by trailer"
              missing=1
            fi
          done
          exit $missing

  licences:
    name: licences, advisories, spdx, secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
      - name: spdx headers
        run: cargo run -p xtask -- spdx
      - name: secret scan
        run: cargo run -p xtask -- secrets

  ui:
    name: qt ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libfuse3-dev fuse3 libdbus-1-dev libgl1-mesa-dev libxkbcommon-dev \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            libqt6svg6-dev qt6-l10n-tools
      - name: build the workspace and the ui
        run: cargo xtask ci
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  mount:
    name: fuse mount smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fuse packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev fuse3 libdbus-1-dev
          sudo modprobe fuse || true
      - name: mount tests
        run: cargo test -p nidvue-mount --all-features -- --include-ignored
