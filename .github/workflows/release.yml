name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (linux-x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libfuse3-dev libdbus-1-dev fuse3 libgl1-mesa-dev libxkbcommon-dev \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            libqt6svg6-dev
      - name: build
        run: cargo build --release --workspace
      - name: build ui
        run: cargo xtask ui
      - name: package
        run: bash packaging/linux.sh
      - name: checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cp ../LICENSE .
          printf '%s\n' \
            "Corresponding source for this release:" \
            "https://github.com/Nidvue/Drive/tree/${{ github.ref_name }}" \
            "" \
            "AGPL-3.0 sections 4-6 are satisfied by the source archive attached" \
            "to this release and by the tag above." > SOURCE-OFFER.txt
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: nidvue-drive-linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: source archive
        run: |
          git archive --format=tar.gz --prefix=nidvue-drive-${GITHUB_REF_NAME}/ \
            -o dist/nidvue-drive-${GITHUB_REF_NAME}-source.tar.gz HEAD
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Nidvue Drive ${GITHUB_REF_NAME}" \
            --prerelease \
            --generate-notes
