name: Feature request
description: Propose a capability, a plugin hook, or a performance improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today? Describe the workflow, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [sync engine, cache, mount, plugins, UI, CLI, SDK, docs, packaging]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require a server-side component (AGPL §13) or an undocumented Jottacloud endpoint.
          required: true
