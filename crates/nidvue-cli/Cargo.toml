[package]
name = "nidvue-cli"
description = "Nidvue Drive headless control: login, mount, sync, status, doctor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nidvue-cli"
path = "src/main.rs"

[dependencies]
nidvue-cache = { workspace = true }
nidvue-core = { workspace = true }
nidvue-plugin = { workspace = true }
nidvue-mount = { workspace = true }
nidvue-sdk = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
nidvue-sdk = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
