[package]
name = "nidvue-sdk"
description = "Nidvue Drive stable Rust SDK: Client, sync, mount, cache, plugins, events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nidvue-cache = { workspace = true }
nidvue-core = { workspace = true }
nidvue-jotta = { workspace = true }
nidvue-mount = { workspace = true }
nidvue-plugin = { workspace = true }
nidvue-sync = { workspace = true }
nidvue-telemetry = { workspace = true }
nidvue-vfs = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
nidvue-plugin = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
schema = []
