[package]
name = "nidvue-mount"
description = "Nidvue Drive FUSE3 / WinFSP / macFUSE mount adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
nidvue-core = { workspace = true }
nidvue-vfs = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# fuser's build script requires libfuse, which does not exist on Windows; the
# Windows adapter does not use it.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
